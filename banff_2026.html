<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banff & Lake Louise · June 2026 — Song Family</title>
<meta name="description" content="Song family trip itinerary: San Francisco, Calgary, Lake Louise & Banff, June 20–27, 2026.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    padding: 32px 16px;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    color: rgba(255,255,255,0.35); text-transform: uppercase; margin-bottom: 8px;
  }
  h1 { font-size: 38px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 8px; }
  .sub { font-size: 15px; color: rgba(255,255,255,0.45); margin-bottom: 20px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0 40px; }
  .card {
    background: rgba(255,255,255,0.05); border-radius: 10px; padding: 12px 14px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .card .lbl { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .card .val { font-size: 17px; font-weight: 700; }
  .card .sub2 { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }

  .day { margin-bottom: 12px; }
  .day-head {
    padding: 16px 20px; cursor: pointer; display: flex; align-items: center;
    justify-content: space-between; user-select: none; border-radius: 12px;
    border: 1px solid; transition: border-radius 0.15s;
  }
  .day.open .day-head { border-radius: 12px 12px 0 0; }
  .day-head-left { display: flex; align-items: center; gap: 14px; }
  .badge {
    color: #000; border-radius: 6px; padding: 3px 8px; font-size: 10px; font-weight: 800;
    letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;
  }
  .day-title { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .day-meta { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }
  .chev { color: rgba(255,255,255,0.4); font-size: 18px; margin-left: 10px; transition: transform 0.2s; }
  .day.open .chev { transform: rotate(90deg); }

  .day-body { display: none; background: #161b22; border: 1px solid; border-top: none; border-radius: 0 0 12px 12px; padding: 20px 20px 4px; }
  .day.open .day-body { display: block; }
  .day-note {
    margin-bottom: 16px; padding: 8px 12px; background: rgba(100,180,255,0.07);
    border-radius: 0 6px 6px 0; font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.5;
  }

  .item { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: flex-start; gap: 12px; }
  .item:last-child { border-bottom: none; }
  .item-icon {
    min-width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
  }
  .item-time { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .item-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
  .item-detail { font-size: 13px; color: rgba(255,255,255,0.65); line-height: 1.5; }
  .item-detail2 { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.5; margin-top: 4px; }
  .conf {
    display: inline-block; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px; padding: 2px 8px; font-size: 11px; letter-spacing: 0.03em;
    color: rgba(255,255,255,0.75); margin-top: 6px; font-family: monospace;
  }
  .item-note {
    margin-top: 8px; padding: 6px 10px; background: rgba(255,200,100,0.1);
    border-left: 3px solid rgba(255,200,100,0.4); border-radius: 0 4px 4px 0;
    font-size: 12px; color: rgba(255,220,120,0.85); line-height: 1.5;
  }

  .footer { margin: 32px auto 0; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); }
  .footer h2 { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
  .rem { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
  .rem .dot { color: rgba(255,200,100,0.5); font-size: 13px; margin-top: 1px; flex-shrink: 0; }
  .rem .txt { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.5; }
  .credit { text-align: center; font-size: 11px; color: rgba(255,255,255,0.25); margin-top: 28px; }

  @media (max-width: 520px) {
    h1 { font-size: 30px; }
    .cards { gap: 6px; }
    .card { padding: 10px; }
    .card .val { font-size: 14px; }
  }
</style>
</head>
<body>

  <h1>Banff &amp;<br>Lake Louise</h1>

  <div class="cards">

</div>

    items: [

    location: "Lake Louise → YYC → SFO", color: "#1a3a5c", accent: "#4a9fd4", who: "Sang · Hyesook · Emily · Minjoo",
    items: [
      { time: "By 11 AM", icon: "🏰", title: "Checkout — Fairmont Château Lake Louise", detail: "Squeeze in a final lakeshore walk before loading the Tesla. Depart by ~10 AM for a comfortable buffer.", conf: "Reservation QCHPBSFK" },
      { time: "12:30 PM", icon: "🚙", title: "Return Tesla at Calgary Airport", detail: "Return by 12:30 PM. ~2 hr drive from Lake Louise, so leave by ~10 AM.", conf: "Confirmation L4803562107" },
      { time: "Afternoon flight", icon: "✈", title: "United UA 2409 — YYC → SFO", detail: "Departs Calgary afternoon, arrives San Francisco early evening. Economy. All four, seats 30C / 30D / 30E / 30F.", conf: "Confirmation B5Z7ZL", note: "Reconfirm exact times in the app — same May 27 schedule-change caveat as the outbound leg." },
      { time: "3:30 PM pickup", icon: "🚗", title: "Hertz — Chevrolet Malibu (SFO)", detail: "SFO airport, 780 McDonnell Road. Pick up Jun 25 3:30 PM, return Jun 27 10:30 AM.", detail2: "2 days · USD 153.74 · Samsung CDP rate · unlimited miles", conf: "Confirmation L48012857C7" },
      { time: "Evening check-in", icon: "🏨", title: "Residence Inn Millbrae Station", detail: "161 North Rollins Rd, Millbrae. 2 nights (Jun 25–27), paid with 102,000 Bonvoy points.", conf: "Confirmation #78751784" }
    ]
  },
  {
    date: "Fri, Jun 26", label: "DAY 5", title: "San Francisco — family day",
    location: "Bay Area", color: "#2a3a1a", accent: "#8abd5c", who: "Sang · Hyesook · Emily · Minjoo",
    items: [
      { time: "All day", icon: "🌉", title: "San Francisco together", detail: "Last full day with all four. Alcatraz (book well ahead), Muir Woods (~25 min from Millbrae), the Exploratorium, or a Napa/Sonoma day trip if you want to venture further." },
      { time: "Note", icon: "🧳", title: "Prep for split departures", detail: "Hyesook flies to Washington Dulles (UA 1791, 1:15 PM departure) tomorrow; pack and confirm tonight." }

  {

    location: "SFO", color: "#3a1a2a", accent: "#d45c85", who: "Separate paths",
    note: "Tight morning: the SFO Malibu is due back by 10:30 AM, then Sang (KE 24, 12:40 PM) and Hyesook (UA 1791, 1:15 PM) both have early-afternoon departures. Build in buffer — return the car early and head straight to the terminals.",
    items: [
      { time: "By 10:30 AM", icon: "🚗", title: "Return Malibu at SFO", detail: "Drop the second SFO Malibu by 10:30 AM.", conf: "Confirmation L48012857C7" },
      { time: "By 11 AM", icon: "🏨", title: "Checkout — Residence Inn Millbrae", detail: "End of the Bonvoy-points stay.", conf: "Confirmation #78751784" },
      { time: "12:40 PM", icon: "🛫", title: "Sang — KE 24 · SFO → Seoul (ICN)", detail: "Korean Air home-leave return. Departs SFO 12:40 PM Jun 27, arrives ICN 5:20 PM Jun 28 (12h 40m, 787-10). Business, seat 12A. Terminal 2 on arrival.", conf: "Booking E4UB3N · Ticket 180-9297853744" },
      { time: "1:15 PM", icon: "✈", title: "Hyesook — UA 1791 · SFO → Washington Dulles (IAD)", detail: "Departs SFO 1:15 PM, arrives IAD 9:25 PM (5h 10m). United Economy (V), seat 35J aisle. From IAD she flies KE 94 to Seoul (ICN) on Jul 3, 1:30 PM → arriving Jul 4 (Business, seat 07A, booking E6O7PV).", detail2: "Was UA 433 / 1:00 PM — rebooked via United's May 27 schedule change.", conf: "Confirmation AMZJPH" },

const reminders = [
  "Three rental cars: SFO Malibu Jun 20–22 (L4801368528), YYC Tesla Jun 22–25 (L4803562107), SFO Malibu Jun 25–27 (L48012857C7). All Samsung CDP rate.",
  "Two Millbrae stays: arrival #76385967 (Jun 20–22, cash/points), return #78751784 (Jun 25–27, 102,000 points). Not duplicates.",
  "United B5Z7ZL had a May 27 schedule change — reconfirm both flight times before each airport run.",
  "Carry an International Driving Permit alongside your license for all rentals.",
  "BASIN: 18+, no devices, 24-hr cancellation. The Jun 22 3:30 PM slot is tight against the flight + 2-hr drive.",
  "Jun 27 splits three ways: Sang KE 24 SFO→ICN 12:40 PM (E4UB3N, arrives Jun 28), Hyesook UA 1791 SFO→IAD 1:15 PM (AMZJPH) then KE 94 IAD→ICN Jul 3 (E6O7PV), Emily & Minjoo stay in the U.S.",
  "Jun 27 morning is tight: Malibu due back 10:30 AM, two early-afternoon departures. Return the car early and go straight to the terminals."
];

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function renderItem(item, accent){
  let h = '<div class="item"><div class="item-icon">'+item.icon+'</div><div style="flex:1">';
  if(item.time) h += '<div class="item-time" style="color:'+accent+'">'+esc(item.time)+'</div>';
  h += '<div class="item-title">'+esc(item.title)+'</div>';
  h += '<div class="item-detail">'+esc(item.detail)+'</div>';
  if(item.detail2) h += '<div class="item-detail2">'+esc(item.detail2)+'</div>';
  if(item.conf) h += '<div><span class="conf">'+esc(item.conf)+'</span></div>';
  if(item.note) h += '<div class="item-note">'+esc(item.note)+'</div>';
  h += '</div></div>';
  return h;
}

const container = document.getElementById('days');
days.forEach((day, i) => {
  const el = document.createElement('div');
  el.className = 'day' + (i === 2 ? ' open' : '');
  let body = '';
  if(day.note) body += '<div class="day-note" style="border-left:3px solid '+day.accent+'">'+esc(day.note)+'</div>';
  day.items.forEach(it => body += renderItem(it, day.accent));
  el.innerHTML =
    '<div class="day-head" style="background:'+day.color+';border-color:'+day.accent+'4d">'
      + '<div class="day-head-left">'
        + '<div class="badge" style="background:'+day.accent+'">'+esc(day.label)+'</div>'
        + '<div><div class="day-title">'+esc(day.title)+'</div>'
        + '<div class="day-meta">'+esc(day.date)+' · '+esc(day.location)+' · '+esc(day.who)+'</div></div>'
      + '</div><div class="chev">&rsaquo;</div></div>'
    + '<div class="day-body" style="border-color:'+day.accent+'40">'+body+'</div>';
  el.querySelector('.day-head').addEventListener('click', () => el.classList.toggle('open'));
  container.appendChild(el);
});

const rem = document.getElementById('reminders');
reminders.forEach(r => {
  const d = document.createElement('div');
  d.className = 'rem';
  d.innerHTML = '<span class="dot">&bull;</span><span class="txt">'+esc(r)+'</span>';
  rem.appendChild(d);
});
</script>
</body>
</html>
